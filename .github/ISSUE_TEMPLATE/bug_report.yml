name: Bug report
description: Report a reproducible application problem without confidential documents.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md. Do not upload personal PDFs, passwords, or confidential information.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prefer a synthetic document and redact private paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, Windows version, and Python version
    validations:
      required: true
